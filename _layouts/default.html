<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="{{ '/assets/img/mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="5.25" stroke="currentColor" stroke-width="1.1"/>
        <path d="M13 1.5v3.2M13 21.3v3.2M1.5 13h3.2M21.3 13h3.2M4.9 4.9l2.3 2.3M18.8 18.8l2.3 2.3M21.1 4.9l-2.3 2.3M7.2 18.8l-2.3 2.3"
              stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-sub">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"        {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/journal/' | relative_url }}"{% if page.url contains '/journal' %}aria-current="page"{% endif %}>Journal</a>
      <a href="{{ '/practice/' | relative_url }}"{% if page.url == '/practice/' %}aria-current="page"{% endif %}>Practice</a>
      <a href="{{ '/about/' | relative_url }}"  {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }} · {{ site.tagline }}</span>
    <span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
      <a href="{{ '/about/' | relative_url }}">Say hello</a>
    </span>
  </div>
</footer>

</body>
</html>
